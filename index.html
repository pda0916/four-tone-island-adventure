function paintFly(){let f=flight;$('#sky').innerHTML='<path d="M35 '+f.ys[0]+' '+f.ys.map((y,i)=>'L'+(130+i*190)+' '+y).join(' ')+'" fill="none" stroke="#65a4ac" stroke-width="4" stroke-dasharray="7 8"/>'+f.ys.map((y,i)=>'<ellipse cx="'+(130+i*190)+'" cy="'+y+'" rx="20" ry="29" fill="none" stroke="'+(i<f.i?'#589d71':i===f.i?'#ed8d38':'#fff4c6')+'" stroke-width="8"/>').join('')+'<text x="'+(f.x-22)+'" y="'+(f.y+12)+'" font-size="37">🛩️</text>'}
function steer(d){if(game.done)return;flight.y=Math.max(14,Math.min(165,flight.y+d));paintFly()}function pass(){if(game.done)return;let f=flight;if(Math.abs(f.y-f.ys[f.i])>23){miss();return}f.x=130+190*f.i;f.i++;beep(350+f.i*90);paintFly();if(f.i===3)win();else $('#msg').textContent='穿過了！下一個光圈在右邊。'}
function bellScene(){serial=0;$('#stage').innerHTML='<div class="letter">'+word(game.c)+'</div><div class="bells">'+levels.map((s,i)=>'<button class="bell" style="--off:'+(2-i)*13+'px" data-note="'+i+'" onclick="strike('+i+')">🔔<br>'+s+'</button>').join('')+'</div>';$('#msg').textContent='按「再聽一次」看音鐘示範，再依序敲三下。'}
function light(n){beep([330,440,590][n]);let b=$('[data-note="'+n+'"]');b?.classList.add('lit');later(()=>b?.classList.remove('lit'),240)}
function melody(){if(game.done)return;let generation=seq;patterns[game.c[2]].forEach((n,i)=>later(()=>{if(!game.done&&generation===seq)light(n)},i*410))}
function strike(n){if(game.done)return;hush();light(n);if(n!==patterns[game.c[2]][serial]){serial=0;miss();return}if(++serial===3)win();else $('#msg').textContent='🎵 '.repeat(serial)+'繼續敲下一個音。'}
function pairScene(){let c=game.c,d=shuffle(cards.filter(x=>x[2]!==c[2]))[0];deck={open:[],found:[],lock:false,tiles:shuffle([[c,0],[c,1],[d,0],[d,1]])};$('#stage').innerHTML='<p>字信 ✉ 和郵戳 ◉ 各翻一張，找出兩對朋友。</p><div class="pairs">'+deck.tiles.map(([x,k],i)=>'<button class="tile" id="tile'+i+'" onclick="flip('+i+')">'+(k?'◉ 郵戳':'✉ 字信')+'</button>').join('')+'</div>'}
function flip(i){let d=deck;if(game.done||d.lock||d.open.includes(i)||d.found.includes(i))return;let [c,k]=d.tiles[i],el=$('#tile'+i);el.innerHTML=k?sym[c[2]]+' '+c[2]+'聲':word(c);if(!k)listen(c[0]);else listen('__tone_'+c[2]);d.open.push(i);if(d.open.length<2)return;let [a,b]=d.open,u=d.tiles[a],v=d.tiles[b];if(u[1]!==v[1]&&u[0][2]===v[0][2]){d.found.push(a,b);d.open=[];for(let j of [a,b])$('#tile'+j).classList.add('done');if(d.found.length===4)win();else $('#msg').textContent='找到一對了！再找另一對。'}else{game.err=true;for(let item of [u,v])if(!item[1])db.wrong[item[0][0]]={wins:0,last:game.id};save();$('#msg').textContent='記住它們的位置，再翻一次。';d.lock=true;later(()=>{for(let j of d.open)$('#tile'+j).textContent=d.tiles[j][1]?'◉ 郵戳':'✉ 字信';d.open=[];d.lock=false},1100)}}
home();
</script></html>
