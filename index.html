function burst(x,y,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*200,vy:-Math.random()*250,life:1})}
function floorAt(x){for(let a of world.gates)if(x>a.x+100&&x<a.x+260)return a.done?510:2000;return 510}
function tick(dt){clock+=dt;if(music&&Math.floor(clock*2)!==Math.floor((clock-dt)*2)&&Math.floor(clock*2)%2===0)beep([262,330,392,330][Math.floor(clock)%4],.22);if(scene!=='play')return;let p=world;let oldY=p.y;p.vx=walking||(((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0));p.x=Math.max(20,Math.min(2910,p.x+p.vx*245*dt));p.vy+=1650*dt;p.y+=p.vy*dt;p.ground=false;let floor=floorAt(p.x);for(let platform of p.platforms)if(p.x>platform.x-16&&p.x<platform.x+platform.w+16&&oldY+40<=platform.y+5&&p.vy>=0)floor=Math.min(floor,platform.y);if(p.y+40>=floor&&p.vy>=0){p.y=floor-40;p.vy=0;p.ground=true}if(p.y>H+180){p.x=p.checkpoint;p.y=360;p.vy=0;status('小狐狸被雲朵接住了！再跳一次。')}p.camera=Math.max(0,Math.min(3000-W,p.x-W*.3));for(let c of p.coins)if(!c.got&&Math.hypot(p.x-c.x,p.y-c.y)<56){c.got=true;save.stars++;persist();burst(c.x,c.y);beep(880,.1);let s=$('.top .pill:nth-child(2)');if(s)s.innerHTML='⭐ '+save.stars+' <span class="mini">顆星星</span>'}for(let gate of p.gates)if(!gate.done&&Math.abs(p.x-gate.x)<80&&p.ground){openTask(gate);return}if(p.x>2800&&p.solved===3)finish()}
function rr(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function fox(x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);let bob=Math.sin(clock*5)*3;g.translate(0,bob);g.fillStyle='#e8884d';g.beginPath();g.ellipse(-27,13,28,12,-.5+Math.sin(clock*4)*.15,0,7);g.fill();g.fillStyle='#fff3d6';g.beginPath();g.ellipse(-46,17,11,9,-.5,0,7);g.fill();rr(-23,-8,46,46,16,'#db7544');g.fillStyle='#e8884d';g.beginPath();g.moveTo(-29,-12);g.lineTo(-25,-58);g.lineTo(-6,-38);g.lineTo(8,-38);g.lineTo(29,-58);g.lineTo(30,-12);g.quadraticCurveTo(0,25,-29,-12);g.fill();g.fillStyle='#f9d5a8';g.beginPath();g.moveTo(-25,-18);g.lineTo(0,-5);g.lineTo(26,-18);g.quadraticCurveTo(0,20,-25,-18);g.fill();g.fillStyle='#273e3d';let blink=Math.sin(clock*.9)> .995;for(let x of [-12,13]){g.beginPath();g.ellipse(x,-22,3.3,blink?1:4.3,0,0,7);g.fill()}g.beginPath();g.arc(0,-6,4,0,7);g.fill();rr(-21,32,16,9,4,'#65493e');rr(7,32,16,9,4,'#65493e');g.restore()}
function draw(){g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#c8e7e6');bg.addColorStop(1,'#f4f0cc');g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='#fff8de';g.beginPath();g.arc(W-140,110,46,0,7);g.fill();let cam=world?.camera||0;for(let i=-1;i<8;i++){let x=i*340-(cam*.2)%340;g.fillStyle='#a9cbb5';g.beginPath();g.ellipse(x,440,270,200,0,0,7);g.fill()}for(let i=0;i<8;i++){let x=(i*230+clock*9)%(W+250)-100;rr(x,85+(i%3)*55,95,22,20,'#ffffff80')}g.save();g.translate(-cam,0);if(scene==='menu'||!world){rr(0,510,3500,300,0,'#6c9b6e');fox(cam+W*.17,470,1.5)}else{let start=0;for(let gate of world.gates){rr(start,510,gate.x+100-start,300,0,'#638b61');rr(start,505,gate.x+100-start,18,7,'#a3bf70');if(gate.done){for(let x=gate.x+100;x<gate.x+260;x+=20)rr(x,505,19,16,3,'#eac88b')}start=gate.x+260;rr(gate.x-18,437,36,68,12,gate.done?'#a9bf87':'#c9e4df');g.font='26px sans-serif';g.fillStyle='#476559';g.fillText(gate.done?'✓':symbols[gate.card[2]],gate.x-12,476);if(!gate.done){g.strokeStyle='#ffe6a1';g.lineWidth=3;g.beginPath();g.arc(gate.x,467,45+Math.sin(clock*3)*5,0,7);g.stroke()}}rr(start,510,3100-start,300,0,'#638b61');rr(start,505,3100-start,18,7,'#a3bf70');for(let p of world.platforms){rr(p.x,p.y,p.w,22,9,'#b2c37c');rr(p.x+8,p.y+18,p.w-16,25,8,'#877a58')}for(let c of world.coins)if(!c.got){g.font='30px sans-serif';g.fillText('⭐',c.x-15,c.y+Math.sin(clock*3+c.x)*7)}for(let i=0;i<50;i++){let x=i*65;g.fillStyle=i%2?'#e5c17d':'#c0d8a2';g.beginPath();g.arc(x,540+(i%3)*19,3,0,7);g.fill()}rr(2800,350,130,160,14,'#f3d59b');rr(2785,340,160,25,8,'#e7a875');rr(2850,450,35,60,18,'#927a67');g.font='38px sans-serif';g.fillText(world.solved===3?'🌈':'🏰',2830,330);fox(world.x,world.y);for(let p of particles){g.globalAlpha=Math.max(0,p.life);g.fillStyle='#ffcf64';g.fillRect(p.x,p.y,7,7)}g.globalAlpha=1}g.restore()}
function loop(t){draw();raf=requestAnimationFrame(loop)}
let simLast=performance.now();setInterval(()=>{let now=performance.now(),remaining=Math.min((now-simLast)/1000,.3);simLast=now;if(document.hidden)return;while(remaining>0){let dt=Math.min(remaining,1/90);tick(dt);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);remaining-=dt}},16);
function resize(){let d=Math.min(devicePixelRatio||1,2);W=Math.max(750,innerWidth);H=720;scale=Math.min(innerWidth/W,innerHeight/H);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);cv.style.objectFit='cover';cv.style.width='100%';cv.style.height='100%'}
window.onresize=resize;window.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)){e.preventDefault();unlock()}keys[e.key]=true;if((e.key===' '||e.key==='ArrowUp')&&!e.repeat)jump()};window.onkeyup=e=>keys[e.key]=false;window.onblur=()=>{keys={};stopVoice()};document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};stopVoice()}});resize();menu();requestAnimationFrame(loop);
</script></body></html>
