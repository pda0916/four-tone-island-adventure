<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#163854"><meta name="description" content="拖曳四種注音聲調塔，保護星星王國！"><title>聲調守衛戰｜注音塔防</title><style>
:root{--navy:#163854;--ink:#19304c;--cream:#fff6dd;--sky:#aee4f3;--lime:#b1df7b;--gold:#ffd66d;--pink:#ff9caf;--cyan:#6fd3e8}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:"Trebuchet MS","Microsoft JhengHei",system-ui,sans-serif;font-weight:750;user-select:none;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}#app{width:min(1100px,100%);margin:auto;padding:8px 14px max(18px,env(safe-area-inset-bottom))}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;color:#fff9e9;padding:3px 0 9px}.resources{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#ffffff19;border:1px solid #ffffff42;border-radius:14px;padding:7px 12px;font-weight:900;white-space:nowrap}.brand{text-align:center;color:#ffdf7e;font-size:clamp(17px,3vw,25px);text-shadow:0 2px #765b26;white-space:nowrap}.right{display:flex;justify-content:flex-end;gap:7px}.roundbtn{border:2px solid #ffffff52;background:#ffffff18;color:#fff7db;border-radius:12px;padding:7px 10px}.board{height:min(66vh,570px);min-height:390px;position:relative;border:5px solid #f7e6b3;border-radius:24px;overflow:hidden;background:linear-gradient(#9be0ef 0 54%,#c6edaa 54% 100%);box-shadow:0 7px 0 #102b44, inset 0 0 0 2px #fff9d466}.sun{position:absolute;right:5%;top:5%;font-size:35px;filter:drop-shadow(0 0 13px #fff4a3)}.cloud{position:absolute;top:12%;font-size:27px;opacity:.8}.hill{position:absolute;left:-8%;right:-8%;bottom:8%;height:28%;background:#86c791;border-radius:50% 52% 0 0;opacity:.85}.pathsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.roadshadow{fill:none;stroke:#588b6d;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.road{fill:none;stroke:#ffe9ae;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 1}.castle{position:absolute;right:1%;bottom:0;font-size:clamp(34px,7vw,64px);filter:drop-shadow(0 4px #806959)}.entrance{position:absolute;left:0;top:8%;font-size:27px}.slot{position:absolute;z-index:2;width:48px;height:48px;border:3px dashed #fff;border-radius:50%;background:#37704d66;transform:translate(-50%,-50%);display:grid;place-items:center;color:#fff;font-size:23px;transition:transform .12s,background .12s}.slot.active{background:#f4b954;border-color:#fff5b3;transform:translate(-50%,-50%) scale(1.12)}.slot.occupied{border-style:solid;background:transparent}#actors{position:absolute;inset:0;z-index:5;pointer-events:none}.enemy{position:absolute;z-index:6;width:92px;transform:translate(-50%,-100%);text-align:center;transition:filter .1s;pointer-events:none}.monster{font-size:34px;line-height:1;filter:drop-shadow(0 3px #345c49)}.speech{display:inline-flex;position:relative;z-index:8;background:#fff;border:3px solid #173f52;border-radius:12px;padding:4px 8px;margin-bottom:3px;font-size:19px;font-weight:1000;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px #426665,0 0 0 2px #fff9}.speech .glyph{font-size:16px;color:#c44849;border-left:1px solid #d2d7d1;padding-left:5px}.hp{height:8px;background:#fff;border:1px solid #355d4b;border-radius:8px;overflow:hidden;margin:3px auto;width:66px}.hp i{height:100%;display:block;background:#65cf6d;transition:width .15s}.bullet{position:absolute;z-index:9;display:grid;place-items:center;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:transparent;color:var(--shot-color);font-size:23px;line-height:1;filter:drop-shadow(0 0 5px var(--shot-color));pointer-events:none;transition:left .22s linear,top .22s linear}.hit{position:absolute;z-index:10;color:#fff;font-size:15px;text-shadow:0 2px #8a453f;animation:float .65s forwards;pointer-events:none}@keyframes float{to{transform:translateY(-28px);opacity:0}}.hudfoot{display:flex;justify-content:space-between;gap:8px;color:#fff7dc;font-size:14px;padding:7px 2px}.feed{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.towercard{position:relative;border:3px solid #fff2d4;border-radius:18px;min-height:92px;padding:8px 5px 7px;text-align:center;background:#f7f2d8;box-shadow:0 5px #102b44;touch-action:none;transition:transform .12s,filter .12s}.towercard:active{transform:translateY(3px);box-shadow:0 2px #102b44}.towercard.selected{outline:4px solid #ffe26d;transform:translateY(-4px)}.towericon{width:42px;height:42px;border-radius:14px;margin:0 auto 2px;display:grid;place-items:center;font-size:27px;color:#fff;border:2px solid #ffffff90}.towername{font-size:14px;font-weight:950}.cost{position:absolute;right:4px;top:3px;font-size:11px;color:#755d30}.help{color:#e1f5e5;font-size:12px;text-align:center;margin:9px 0}.banner{position:absolute;z-index:7;inset:0;display:grid;place-items:center;background:#15385055;animation:fade .25s}.banner>div{max-width:85%;text-align:center;background:#fff6dd;border:4px solid #e4bb64;border-radius:23px;padding:17px 23px;box-shadow:0 6px #815f3a;font-size:clamp(19px,4vw,28px);animation:pop .35s}.banner small{font-size:14px;display:block;margin-top:5px}@keyframes pop{50%{transform:scale(1.06)}}@keyframes fade{from{opacity:0}to{opacity:1}}.toast{position:fixed;z-index:9;left:50%;top:12%;transform:translateX(-50%);background:#213e51;color:white;border-radius:15px;padding:10px 17px;box-shadow:0 5px #102b44;white-space:nowrap;font-size:14px}.modalbg{position:fixed;z-index:10;inset:0;background:#1025399c;display:grid;place-items:center;padding:18px}.modal{width:min(440px,100%);background:#fff7df;border:4px solid #f1d68f;border-radius:25px;text-align:center;padding:20px;box-shadow:0 8px #102b44}.modal h1{margin:0 0 7px}.bigbtn{border:0;border-radius:14px;background:#ffca64;padding:11px 21px;box-shadow:0 4px #a87539;font-weight:950}.intro{color:#fff7dc;font-size:14px;line-height:1.6;margin:8px 2px}.guide{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.tag{background:#f0e4bc;padding:5px 8px;border-radius:12px;font-size:13px}.dim{opacity:.4;filter:grayscale(.7)}@media(max-width:620px){#app{padding:5px 8px 14px}.hud{grid-template-columns:1fr auto;gap:5px}.brand{grid-row:1;grid-column:1;text-align:left}.resources{grid-row:2;grid-column:1}.right{grid-column:2;grid-row:1 / span 2;gap:3px}.right .stat{padding:4px 5px;font-size:11px}.stat{padding:5px 8px;font-size:13px}.roundbtn{padding:4px 5px;font-size:12px}.board{height:58vh;min-height:350px;max-height:470px;border-width:4px;border-radius:18px}.slot{width:39px;height:39px;font-size:19px}.enemy{width:82px}.monster{font-size:29px}.speech{font-size:18px;padding:3px 6px}.speech .glyph{font-size:14px}.hp{width:58px}.feed{gap:6px}.towercard{min-height:82px;border-width:2px;border-radius:14px}.towericon{width:35px;height:35px;font-size:23px}.towername{font-size:12px}.cost{font-size:10px}.hudfoot{font-size:12px}.help{font-size:11px}.intro{margin:5px 2px;font-size:12px}}
</style></head><body><main id="app"></main><script>
const cards=[['媽','ㄇㄚ',1],['麻','ㄇㄚˊ',2],['馬','ㄇㄚˇ',3],['罵','ㄇㄚˋ',4],['爸','ㄅㄚˋ',4],['師','ㄕ',1],['事','ㄕˋ',4],['答','ㄉㄚˊ',2],['大','ㄉㄚˋ',4],['天','ㄊㄧㄢ',1],['甜','ㄊㄧㄢˊ',2],['點','ㄉㄧㄢˇ',3],['電','ㄉㄧㄢˋ',4],['書','ㄕㄨ',1],['鼠','ㄕㄨˇ',3],['樹','ㄕㄨˋ',4],['花','ㄏㄨㄚ',1],['茶','ㄔㄚˊ',2],['米','ㄇㄧˇ',3],['笑','ㄒㄧㄠˋ',4]];
const tones=[{name:'一聲塔',mark:'ˉ',color:'#348ee4',icon:'💧'},{name:'二聲塔',mark:'ˊ',color:'#48b875',icon:'🌱'},{name:'三聲塔',mark:'ˇ',color:'#9b68d5',icon:'🍄'},{name:'四聲塔',mark:'ˋ',color:'#e87954',icon:'🔥'}],maps=[{name:'綠野長廊',route:[[-.03,.14],[.19,.14],[.19,.34],[.81,.34],[.81,.52],[.27,.52],[.27,.70],[.88,.70],[.88,.87],[.38,.87],[.38,.97],[1.04,.97]],slots:[[11,25],[40,23],[91,25],[92,44],[12,44],[53,43],[12,63],[57,63],[96,60],[15,81],[68,82],[68,94]]},{name:'沙丘迴旋道',route:[[-.03,.82],[.18,.82],[.18,.61],[.82,.61],[.82,.40],[.29,.40],[.29,.18],[.91,.18],[.91,.87],[1.04,.87]],slots:[[11,69],[47,78],[91,69],[91,49],[55,49],[12,50],[12,30],[56,28],[96,29],[20,92],[54,92],[73,75]]},{name:'雲島穿梭線',route:[[-.03,.18],[.84,.18],[.84,.38],[.17,.38],[.17,.58],[.83,.58],[.83,.78],[.33,.78],[.33,.93],[1.04,.93]],slots:[[12,27],[47,27],[94,29],[91,48],[48,48],[10,48],[10,68],[49,68],[94,68],[15,87],[65,87],[70,96]]},{name:'星堡曲折路',route:[[-.03,.47],[.16,.47],[.16,.17],[.86,.17],[.86,.38],[.30,.38],[.30,.60],[.86,.60],[.86,.81],[.22,.81],[.22,.94],[1.04,.94]],slots:[[11,35],[48,28],[94,28],[94,49],[57,49],[11,57],[11,72],[56,70],[94,72],[12,89],[55,89],[72,96]]}],levels=[{waves:3,count:2,interval:4.2,speed:.019},{waves:6,count:3,interval:3.6,speed:.022},{waves:9,count:4,interval:3.1,speed:.025},{waves:12,count:5,interval:2.7,speed:.028}],monsterSets=[{normal:'👾',fast:'🐸',tank:'🐗',boss:'👹'},{normal:'🐫',fast:'🦂',tank:'🦅',boss:'🐲'},{normal:'👻',fast:'🦇',tank:'🧟',boss:'🐙'},{normal:'🐺',fast:'🕷️',tank:'🦖',boss:'🐉'}];let route=maps[0].route,slots=maps[0].slots,app=document.querySelector('#app'),state=null,audioOn=true,audioCtx=null,raf=0,last=0,selected=null,spawnTimer=0,toastTimer=0;
function fresh(){return{running:false,paused:false,result:'',wave:0,levelWave:1,lives:10,gold:140,score:0,kills:0,combo:0,spawned:0,waveSize:0,enemies:[],towers:[],nextId:0,fireClock:0,lastSpawn:0}}
function say(text){if(!audioOn||!window.speechSynthesis)return;const voice=speechSynthesis.getVoices().find(v=>/^zh[-_]TW/i.test(v.lang));if(!voice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.rate=.82;speechSynthesis.speak(u)}
function sound(ok=true){if(!audioOn)return;try{audioCtx??=new AudioContext();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=ok?790:240;g.gain.value=.075;o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch{}}
function pathData(){return route.map((p,i)=>(i?'L':'M')+(p[0]*100)+' '+(p[1]*100)).join(' ')}
function build(){let s=state,idx=Math.max(0,(s.wave||1)-1),map=maps[idx];route=map.route;slots=map.slots;let d=pathData();app.innerHTML=`<section class="hud"><div class="resources"><span class="stat">❤️ <b id="lives">10</b></span><span class="stat">💰 <b id="gold">140</b></span><span class="stat">⭐ <b id="score">0</b></span></div><div class="brand">🏰 聲調守衛戰</div><div class="right"><span class="stat"><b id="wave">0</b>/4關</span><button class="roundbtn" id="pause">Ⅱ 暫停</button><button class="roundbtn" id="sound">🔊</button></div></section><div class="board" id="board"><div class="sun">☀️</div><div class="cloud" style="left:15%">☁️</div><div class="cloud" style="left:52%;top:18%">☁️</div><div class="hill"></div><svg class="pathsvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="roadshadow" d="${d}"/><path class="road" d="${d}"/></svg><span class="entrance" style="top:${Math.max(2,map.route[0][1]*100-8)}%">🌀</span><span class="castle">🏰</span>${slots.map((p,i)=>`<button class="slot" data-slot="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="空塔位 ${i+1}">＋</button>`).join('')}<div id="actors"></div><div id="banner"></div></div><div class="hudfoot"><span id="mission">${map.name}｜守住星星城堡！</span><span id="waveinfo">${levels[idx].waves} 波・每波 ${levels[idx].count} 隻・慢速入門</span></div><div class="feed">${tones.map((t,i)=>`<button class="towercard" data-tone="${i+1}" aria-label="拖曳${t.name}，40金幣"><span class="cost">💰 40</span><span class="towericon" style="background:${t.color}">${t.icon}</span><span class="towername">${t.name} ${t.mark}</span></button>`).join('')}</div><p class="help">拖曳聲調塔到 12 個空位，或點塔再點空位。對的聲調傷害 10，其他聲調傷害 1。點已放置的塔可升級、改聲調或出售。</p>`;document.querySelector('.right .stat').insertAdjacentHTML('beforeend','·<b id="levelwave">1</b>/<b id="wavecount">'+levels[idx].waves+'</b>波');bind();updateHUD();if(s.running)drawActors()}
function bind(){document.querySelectorAll('.towercard').forEach(card=>{card.addEventListener('pointerdown',e=>{if(!state.running||state.paused||state.result)return;e.preventDefault();closeTowerMenu();selected=+card.dataset.tone;document.querySelectorAll('.towercard').forEach(x=>x.classList.toggle('selected',x===card));card.setPointerCapture?.(e.pointerId)});card.addEventListener('pointerup',e=>{let el=document.elementFromPoint(e.clientX,e.clientY),slot=el?.closest('.slot');if(slot)place(+slot.dataset.slot,+card.dataset.tone)})});document.querySelectorAll('.slot').forEach(el=>{el.onclick=()=>{let id=+el.dataset.slot,t=state.towers.find(x=>x.slot===id);if(t)openTowerMenu(t);else if(selected){closeTowerMenu();place(id,selected)}}});document.querySelector('#pause').onclick=()=>pause();document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'🔊':'🔇';if(!audioOn)speechSynthesis?.cancel()};}
function start(){state=fresh();state.running=true;state.wave=1;state.levelWave=1;state.waveSize=levels[0].count;selected=null;build();document.querySelector('#waveinfo').textContent='慢慢看注音，怪物分批出現';showBanner('🌱 第 1 關開始！','3 波、每波 2 隻慢速小怪，第 3 波最後會出現大魔王。',1800);say('第一關開始，一共有三波怪物，每波很少，最後會有大魔王。');updateHUD();last=performance.now();raf=requestAnimationFrame(loop)}
function place(slot,tone){if(!state?.running||state.paused||state.result)return;let old=state.towers.find(t=>t.slot===slot);if(old){selected=null;upgrade(old);return}if(state.gold<40){toast('金幣不夠！打倒怪物可以得到金幣。');sound(false);return}state.gold-=40;state.towers.push({id:++state.nextId,slot,tone,level:1,cooldown:.1});selected=null;document.querySelectorAll('.towercard').forEach(x=>x.classList.remove('selected'));updateHUD();sound(true);drawActors()}
function upgrade(t){if(!state.running||state.paused||state.result)return;if(t.level>=3){toast('這座塔已經升到最高級！');return}let cost=50*t.level;if(state.gold<cost){toast('升級需要 '+cost+' 枚金幣。');return}state.gold-=cost;t.level++;closeTowerMenu();toast(tones[t.tone-1].name+'升級到 Lv.'+t.level+'！');sound(true);updateHUD();drawActors()}
function closeTowerMenu(){document.querySelector('.tower-menu')?.remove()}
function openTowerMenu(t){closeTowerMenu();let board=document.querySelector('#board'),menu=document.createElement('div'),refund=Math.floor((40+(t.level>1?50:0)+(t.level>2?100:0))*.6);menu.className='tower-menu';menu.style.cssText='position:absolute;z-index:12;left:50%;bottom:8px;transform:translateX(-50%);width:min(95%,460px);background:#fff7df;border:3px solid #765b37;border-radius:17px;padding:8px;text-align:center;box-shadow:0 5px #102b44';menu.innerHTML=`<b>${tones[t.tone-1].name} Lv.${t.level}</b><div style="display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:6px 0">${tones.map((tone,i)=>`<button onclick="changeTowerTone(${t.id},${i+1})" style="border:2px solid #456;border-radius:10px;background:${tone.color};color:white;padding:5px 8px;font-weight:900">${tone.mark}</button>`).join('')}<button onclick="upgrade(state.towers.find(x=>x.id===${t.id}))" style="border:0;border-radius:10px;background:#ffcb68;padding:5px 9px;font-weight:900">升級</button><button onclick="sellTower(${t.id})" style="border:0;border-radius:10px;background:#ff9c8c;padding:5px 9px;font-weight:900">出售 +${refund}💰</button><button onclick="closeTowerMenu()" style="border:0;border-radius:10px;background:#dfe7e4;padding:5px 9px;font-weight:900">關閉</button></div>`;board.append(menu)}
function changeTowerTone(id,tone){if(!state.running||state.paused||state.result)return;let t=state.towers.find(x=>x.id===id);if(!t)return;t.tone=tone;closeTowerMenu();toast('防禦塔已改成'+tones[tone-1].name+'！');sound(true);drawActors()}
function sellTower(id){if(!state.running||state.paused||state.result)return;let t=state.towers.find(x=>x.id===id);if(!t)return;let refund=Math.floor((40+(t.level>1?50:0)+(t.level>2?100:0))*.6);state.gold+=refund;state.towers=state.towers.filter(x=>x.id!==id);closeTowerMenu();updateHUD();drawActors();sound(true);toast('防禦塔已出售，獲得 '+refund+' 枚金幣。')}
function spawn(){let s=state,level=levels[s.wave-1],c=cards[(Math.random()*cards.length)|0],idx=s.spawned,boss=s.levelWave===level.waves&&idx===level.count-1,kind=boss?'boss':idx%7===5?'fast':idx%7===6?'tank':'normal',hp=boss?110+45*(s.wave-1):kind==='tank'?48+8*(s.wave-1):kind==='fast'?20+5*(s.wave-1):30+8*(s.wave-1),speed=level.speed*(kind==='fast'?1.35:kind==='tank'?.76:kind==='boss'?.72:1);s.enemies.push({id:++s.nextId,card:c,kind,hp,max:hp,progress:0,speed,hit:0});s.spawned++;drawActors();say(c[0]+'，現在是第 '+c[2]+' 聲。')}
function at(progress){let lengths=[],total=0;for(let i=1;i<route.length;i++){let dx=route[i][0]-route[i-1][0],dy=route[i][1]-route[i-1][1],l=Math.hypot(dx,dy);lengths.push(l);total+=l}let d=progress*total;for(let i=0;i<lengths.length;i++){if(d<=lengths[i]){let f=d/lengths[i];return{x:route[i][0]+(route[i+1][0]-route[i][0])*f,y:route[i][1]+(route[i+1][1]-route[i][1])*f}}d-=lengths[i]}return{x:route.at(-1)[0],y:route.at(-1)[1]}}
function loop(now){if(!state?.running||state.result)return;let dt=Math.min((now-last)/1000,.05);last=now;if(!state.paused)tick(dt);raf=requestAnimationFrame(loop)}
function tick(dt){let s=state,level=levels[s.wave-1];s.fireClock+=dt;s.enemies.forEach(e=>{e.progress+=e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(e.progress>=1){e.leaked=true;s.lives--;sound(false);toast('怪物跑到城堡了！❤️ −1');say('有怪物溜過去了，繼續守城！')}});s.enemies=s.enemies.filter(e=>!e.leaked&&e.hp>0);if(s.spawned<s.waveSize&&s.fireClock-s.lastSpawn>level.interval){spawn();s.lastSpawn=s.fireClock}for(let tower of s.towers){tower.cooldown-=dt;if(tower.cooldown>0)continue;let pos=slots[tower.slot];let target=s.enemies.find(e=>{let q=at(e.progress);return e.hp>0&&!e.dead&&Math.hypot((q.x-pos[0]/100)*.8,(q.y-pos[1]/100))<.31});if(!target)continue;tower.cooldown=Math.max(.42,1.02-(tower.level-1)*.2);let right=target.card[2]===tower.tone;target.hp-=right?10+(tower.level-1)*4:1;target.hit=.16;bullet(tower.slot,target,right,tower.tone);if(right){s.combo++;s.score+=10;target.card[2]===tower.tone&&s.combo>0&&s.combo%3===0&&(s.gold+=5,toast('連續答對 '+s.combo+' 次！獎勵 +5 金幣'))}else s.combo=0;if(target.hp<=0&&!target.dead){target.dead=true;s.gold+=kindReward(target);s.kills++;s.score+=20;if(s.kills%3===0)s.gold+=5;document.getElementById('e'+target.id)?.remove()}sound(right);updateHUD()}s.enemies=s.enemies.filter(e=>!e.dead);drawActors();if(s.lives<=0){end(false);return}if(s.spawned===s.waveSize&&s.enemies.length===0){s.nextWaveDelay=(s.nextWaveDelay||0)+dt;if(s.nextWaveDelay>1.6){s.nextWaveDelay=0;if(s.levelWave<level.waves){s.levelWave++;s.spawned=0;s.waveSize=level.count;s.lastSpawn=s.fireClock;showBanner('🌊 第 '+s.wave+' 關・第 '+s.levelWave+' / '+level.waves+' 波','下一批怪物來了！先看清楚牠們的注音。',1300);say('下一波怪物來了，記得看注音喔！')}else if(s.wave>=4){end(true);return}else{s.wave++;s.levelWave=1;s.spawned=0;s.waveSize=levels[s.wave-1].count;s.towers=[];s.gold+=100;s.lastSpawn=s.fireClock;build();showBanner('🗺️ 來到新地圖！','防禦塔已收回，獲得 100 枚建塔金幣。',1900);say('恭喜過關！來到新的地圖，開始新的關卡。')}updateHUD()}}}
function kindReward(e){return e.kind==='boss'?100:e.kind==='tank'?30:e.kind==='fast'?18:22}
function drawActors(){if(!state)return;let root=document.querySelector('#actors');if(!root)return;let live=new Set();for(let e of state.enemies){live.add('e'+e.id);let el=document.getElementById('e'+e.id);if(!el){el=document.createElement('div');el.id='e'+e.id;el.className='enemy';root.append(el)}let p=at(e.progress);el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%';el.style.zIndex=String(20+Math.round(e.progress*10));el.style.filter=e.hit?'brightness(1.9)':'';el.innerHTML=`<div class="speech" style="${e.kind==='boss'?'border-color:#b8342d;box-shadow:0 3px #84251f,0 0 0 3px #ffd66d':''}"><span class="zhuyin">${e.card[1]}</span><b class="glyph">${e.kind==='boss'?'👑 '+e.card[0]:e.card[0]}</b></div><div class="hp" style="${e.kind==='boss'?'width:78px;height:11px;border:2px solid #9e2727':''}"><i style="width:${Math.max(0,e.hp/e.max*100)}%;${e.kind==='boss'?'background:#e64f43':''}"></i></div><div class="monster" style="${e.kind==='boss'?'font-size:54px;filter:drop-shadow(0 0 9px #ff4938)':''}">${monsterSets[state.wave-1][e.kind]}</div>`}root.querySelectorAll('.enemy').forEach(el=>{if(!live.has(el.id))el.remove()});document.querySelectorAll('.slot').forEach(el=>{let t=state.towers.find(x=>x.slot===+el.dataset.slot);el.classList.toggle('occupied',!!t);el.classList.toggle('active',!t&&!!selected);el.innerHTML=t?`<span style="font-size:23px">${tones[t.tone-1].icon}</span><small style="position:absolute;bottom:-15px;font-size:10px;color:#19304c;white-space:nowrap">Lv.${t.level}</small>`:(selected?'＋':'')})}
function bullet(slot,target,correct,tone){let root=document.querySelector('#actors'),a=slots[slot],b=at(target.progress),el=document.createElement('i');el.className='bullet';el.textContent=tones[tone-1].icon;el.style.setProperty('--shot-color',tones[tone-1].color);el.style.left=a[0]+'%';el.style.top=a[1]+'%';root.append(el);requestAnimationFrame(()=>{let q=at(target.progress);el.style.left=q.x+'%';el.style.top=q.y+'%'});setTimeout(()=>el.remove(),260);let h=document.createElement('b');h.className='hit';h.textContent=correct?'−10':'−1';h.style.left=b.x+'%';h.style.top=b.y+'%';root.append(h);setTimeout(()=>h.remove(),700)}
function updateHUD(){if(!state)return;let set=(id,x)=>{let e=document.getElementById(id);if(e)e.textContent=x};set('lives',state.lives);set('gold',state.gold);set('score',state.score);set('wave',state.wave);set('levelwave',state.levelWave);set('wavecount',levels[Math.max(0,state.wave-1)].waves);set('waveinfo','第 '+state.levelWave+' / '+levels[Math.max(0,state.wave-1)].waves+' 波・每波 '+levels[Math.max(0,state.wave-1)].count+' 隻怪物')}
function showBanner(title,sub,ms=0){let b=document.querySelector('#banner');if(!b)return;b.innerHTML=`<div>${title}<small>${sub}</small></div>`;if(ms)setTimeout(()=>{if(b)b.innerHTML=''},ms)}
function pause(){if(!state?.running||state.result)return;state.paused=!state.paused;document.querySelector('#pause').textContent=state.paused?'▶ 繼續':'Ⅱ 暫停';if(state.paused)showBanner('⏸️ 休息一下','怪物暫停移動。');else document.querySelector('#banner').innerHTML=''}
function end(win){state.result=win?'win':'lose';state.running=false;cancelAnimationFrame(raf);let b=document.querySelector('#banner');b.innerHTML=`<div>${win?'🏆 守住星星城堡！':'🛡️ 城堡需要再加強！'}<small>${win?'完成四張地圖、30 波怪物，還打敗了四隻大魔王！':'再試一次，記得多蓋對的聲調塔。'}　⭐ ${state.score} 分</small><p><button class="bigbtn" onclick="start()">${win?'再玩一次':'重新守城'}</button></p></div>`;say(win?'太棒了！你完成四個關卡，也打敗了四隻大魔王！':'城堡生命用完了，再試一次，你會守得更好！')}
function toast(text){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=text;clearTimeout(window._toast);window._toast=setTimeout(()=>el.remove(),1450)}
function beginScreen(){state=fresh();app.innerHTML=`<div class="modalbg"><section class="modal"><div style="font-size:64px">🏰</div><h1>聲調守衛戰</h1><p>注音小怪物要來攻打星星城堡！<br>拖曳聲調塔到地圖空位，讓防禦塔自動守城。</p><div class="guide">${tones.map(t=>`<span class="tag" style="color:${t.color}">${t.mark} ${t.name}</span>`).join('')}</div><p>答對聲調：<b>10 點傷害</b>　答錯：<b>1 點傷害</b><br>通過 4 個不同地圖：3、6、9、12 波逐步升級，最後迎戰大魔王！</p><button class="bigbtn" onclick="launch()">開始保衛城堡！</button><p style="font-size:12px;color:#69727b">電腦可拖曳滑鼠；手機可點塔，再點地圖空位。</p></section></div>`}
function launch(){state.wave=1;state.levelWave=1;state.waveSize=levels[0].count;build();showBanner('🌱 第 1 關開始！','3 波、每波 2 隻慢速小怪，第 3 波最後會出現大魔王。',1800);state.running=true;state.lastSpawn=-1;updateHUD();last=performance.now();raf=requestAnimationFrame(loop);say('第一關有三波怪物，每波只有兩隻，第 3 波最後會出現大魔王。')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state?.running)pause()});beginScreen();
</script></body></html>
