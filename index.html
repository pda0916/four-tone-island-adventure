function sound(ok=true){if(!audioOn)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx??=new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=ok?790:240;g.gain.value=.075;o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch{}}

function build(){let s=state,idx=Math.max(0,(s.wave||1)-1),map=maps[idx],level=levels[idx];route=map.route;slots=Array.from({length:level.slots},(_,i)=>map.slots[Math.round(i*(map.slots.length-1)/(level.slots-1))]);let d=pathData();app.innerHTML=`<section class="hud"><div class="resources"><span class="stat">❤️ <b id="lives">10</b></span><span class="stat">💰 <b id="gold">1000</b></span></div><div class="brand">🏰 聲調守衛戰</div><div class="right"><span class="stat"><b id="wave">0</b>/4關</span><button class="roundbtn" id="pause">Ⅱ 暫停</button><button class="roundbtn" id="sound">🔊</button></div></section><div class="board" id="board"><div class="sun">☀️</div><div class="cloud" style="left:15%">☁️</div><div class="cloud" style="left:52%;top:18%">☁️</div><div class="hill"></div><svg class="pathsvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="roadshadow" d="${d}"/><path class="road" d="${d}"/></svg><span class="entrance" style="top:${Math.max(2,map.route[0][1]*100-8)}%">🌀</span>${castleMarkup(s.learning)}${slots.map((p,i)=>`<button class="slot" data-slot="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="空塔位 ${i+1}">＋</button>`).join('')}<div id="actors"></div><div class="banner" id="banner"></div></div><div class="hudfoot"><span id="waveinfo">第 1 / ${levels[idx].waves} 波</span></div><div class="feed">${tones.map((t,i)=>`<button class="towercard" data-tone="${i+1}" aria-label="拖曳${t.name}，40金幣"><span class="cost">💰 40</span><span class="towericon" style="background:linear-gradient(#6fd3ff,#389bea)"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${t.path}" fill="none" stroke="${t.markColor}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="towername">${t.name} ${t.mark}</span></button>`).join('')}</div><p class="help">拖曳聲調塔到 ${slots.length} 個空位，或點塔再點空位。防禦塔只會攻擊和自己聲調相同的怪物。每放置或更改一座塔，短暫等待後就會出現下一隻怪物；點注音字卡可重聽題目。</p>`;document.querySelector('.right .stat').insertAdjacentHTML('beforeend','·<b id="levelwave">1</b>/<b id="wavecount">'+levels[idx].waves+'</b>波');bind();updateHUD();if(s.running)drawActors()}
function bind(){document.querySelectorAll('.towercard').forEach(card=>{card.addEventListener('pointerdown',e=>{if(!state.running||state.paused||state.result)return;unlockAudio();e.preventDefault();closeTowerMenu();selected=+card.dataset.tone;document.querySelectorAll('.towercard').forEach(x=>x.classList.toggle('selected',x===card));card.setPointerCapture?.(e.pointerId)});card.addEventListener('pointerup',e=>{let el=document.elementFromPoint(e.clientX,e.clientY),slot=el?.closest('.slot');if(slot)place(+slot.dataset.slot,+card.dataset.tone)})});document.querySelectorAll('.slot').forEach(el=>{el.onclick=()=>{unlockAudio();let id=+el.dataset.slot,t=state.towers.find(x=>x.slot===id);if(t)openTowerMenu(t);else if(selected){closeTowerMenu();place(id,selected)}}});document.querySelector('#pause').onclick=()=>pause();document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'🔊':'🔇';if(!audioOn){stopVoice()}};}
function start(){unlockAudio();clearTimeout(spawnTimer);spawnTimer=0;state=fresh();state.gold=Math.max(1000,state.gold);state.running=true;state.wave=chosenStage;state.levelWave=1;state.waveSize=levels[chosenStage-1].count;selected=null;build();showBanner('🗺️ 第 '+chosenStage+' 關開始！',maps[chosenStage-1].name+'・'+levels[chosenStage-1].waves+' 波，最後會有大魔王。',1800);window.speechSynthesis?.resume();spawn();updateHUD();last=performance.now();raf=requestAnimationFrame(loop)}
function place(slot,tone){if(!state?.running||state.paused||state.result)return;let old=state.towers.find(t=>t.slot===slot);if(old){selected=null;upgrade(old);return}if(state.gold<40){toast('金幣不夠！打倒怪物可以得到金幣。');sound(false);return}state.gold-=40;state.towers.push({id:++state.nextId,slot,tone,level:1,cooldown:.1});recordTowerDecision(tone);selected=null;document.querySelectorAll('.towercard').forEach(x=>x.classList.remove('selected'));updateHUD();sound(true);announceTone(tone);drawActors();advanceAfterTower()}
function upgrade(t){if(!state.running||state.paused||state.result)return;if(t.level>=3){toast('這座塔已經升到最高級！');return}let cost=50*t.level;if(state.gold<cost){toast('升級需要 '+cost+' 枚金幣。');return}state.gold-=cost;t.level++;closeTowerMenu();toast(tones[t.tone-1].name+'升級到 Lv.'+t.level+'！');sound(true);updateHUD();drawActors()}
function closeTowerMenu(){document.querySelector('.tower-menu')?.remove()}
function openTowerMenu(t){closeTowerMenu();let board=document.querySelector('#board'),menu=document.createElement('div');menu.className='tower-menu';menu.style.cssText='position:absolute;z-index:12;left:50%;bottom:8px;transform:translateX(-50%);width:min(95%,460px);background:#fff7df;border:3px solid #765b37;border-radius:17px;padding:8px;text-align:center;box-shadow:0 5px #102b44';menu.innerHTML=`<b>${tones[t.tone-1].name} Lv.${t.level}</b><div style="display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:6px 0">${tones.map((tone,i)=>`<button onclick="changeTowerTone(${t.id},${i+1})" aria-label="改成${tone.name}" title="${tone.name}" style="border:2px solid #2181c9;border-radius:50%;background:linear-gradient(#6fd3ff,#389bea);width:46px;height:46px;padding:3px;display:grid;place-items:center"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><path d="${tone.path}" fill="none" stroke="${tone.markColor}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`).join('')}<button onclick="upgrade(state.towers.find(x=>x.id===${t.id}))" style="border:0;border-radius:10px;background:#ffcb68;padding:5px 9px;font-weight:900">升級</button><button onclick="closeTowerMenu()" style="border:0;border-radius:10px;background:#dfe7e4;padding:5px 9px;font-weight:900">關閉</button></div>`;board.append(menu)}
function changeTowerTone(id,tone){if(!state.running||state.paused||state.result)return;let t=state.towers.find(x=>x.id===id);if(!t)return;t.tone=tone;recordTowerDecision(tone);closeTowerMenu();toast('防禦塔已改成'+tones[tone-1].name+'！');sound(true);announceTone(tone);drawActors();advanceAfterTower()}
function kindReward(enemy){return enemy.kind==='boss'?80:enemy.kind==='tank'?18:enemy.kind==='fast'?12:10}
function schedulePendingEnemy(delay=1000){if(!state?.nextEnemyPending||state.paused||state.result)return;clearTimeout(spawnTimer);spawnTimer=setTimeout(()=>{spawnTimer=0;if(!state?.running||state.result)return;if(state.paused){state.nextEnemyPending=true;return}state.nextEnemyPending=false;if(state.spawned<state.waveSize)spawn()},delay)}
function sayThenSpawn(text){if(!state)return;state.nextEnemyPending=true;let done=false,timer;const continueGame=()=>{if(done)return;done=true;clearTimeout(timer);schedulePendingEnemy(0)};timer=setTimeout(continueGame,Math.min(9500,Math.max(5500,text.length*300)));say(text,continueGame)}
function advanceAfterTower(){if(!state?.running||state.paused||state.result||!state.awaitingTowerPlacement)return;state.awaitingTowerPlacement=false;state.nextEnemyPending=true;schedulePendingEnemy()}
function spawn(){
 let s=state,level=levels[s.wave-1],profile=difficultyProfile(),pool=cards;
 if(profile.label==='熟練挑戰'&&s.lastMonsterTone)pool=cards.filter(x=>x[2]!==s.lastMonsterTone);
 let c=pool[(Math.random()*pool.length)|0];s.lastMonsterTone=c[2];let idx=s.spawned,boss=s.levelWave===level.waves&&idx===level.count-1;
 let fastSlot=Math.floor(level.count/3),tankSlot=Math.max(fastSlot+1,level.count-2);
 let kind=boss?'boss':s.levelWave>=4&&idx%6===tankSlot%6?'tank':s.levelWave>=2&&idx%4===fastSlot%4?'fast':'normal';
 let baseHp=boss?110+45*(s.wave-1)+(s.wave===4?120:0):kind==='tank'?48+8*(s.wave-1):kind==='fast'?20+5*(s.wave-1):30+8*(s.wave-1);
 let hp=Math.round(baseHp*Math.pow(boss?1.2:1.3,s.levelWave-1));
 let speed=level.speed*(kind==='fast'?1.35:kind==='tank'?.76:kind==='boss'?.72:1)*Math.min(1.3,1+(s.levelWave-1)*.025)*profile.speed;
 s.enemies.push({id:++s.nextId,card:c,kind,hp,max:hp,progress:0,speed,hit:0});s.spawned++;s.awaitingTowerPlacement=s.spawned<s.waveSize;s.lastSpawn=s.fireClock;drawActors();playRecordedPrompt(c)
}
function at(progress){let lengths=[],total=0;for(let i=1;i<route.length;i++){let dx=route[i][0]-route[i-1][0],dy=route[i][1]-route[i-1][1],l=Math.hypot(dx,dy);lengths.push(l);total+=l}let d=progress*total;for(let i=0;i<lengths.length;i++){if(d<=lengths[i]){let f=d/lengths[i];return{x:route[i][0]+(route[i+1][0]-route[i][0])*f,y:route[i][1]+(route[i+1][1]-route[i][1])*f}}d-=lengths[i]}return{x:route.at(-1)[0],y:route.at(-1)[1]}}
function loop(now){if(!state?.running||state.result)return;let dt=Math.min((now-last)/1000,.05);last=now;try{if(!state.paused)tick(dt)}catch(err){console.error('Game loop error:',err);state.running=false;state.paused=true;let b=document.querySelector('#banner');if(b){b.classList.add('failure');b.innerHTML=`<div>遊戲暫停了<small>遊戲遇到小問題，請回到首頁重新開始。</small><p><button class="bigbtn" onclick="beginScreen()">回到首頁</button></p></div>`}return}raf=requestAnimationFrame(loop)}
function tick(dt){
 let s=state,level=levels[s.wave-1];
 s.fireClock+=dt;
 s.enemies.forEach(e=>{e.progress+=e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(e.progress>=1&&!e.leaked){e.leaked=true;s.lives=Math.max(0,s.lives-1);updateHUD();sound(false);toast('怪物跑到城堡了！❤️ −1');say('有怪物溜過去了，繼續守城！')}});
 s.enemies=s.enemies.filter(e=>!e.leaked&&e.hp>0);
 if(s.lives<=0){drawActors();end(false);return}
  for(let tower of s.towers){tower.cooldown-=dt;if(tower.cooldown>0)continue;let pos=slots[tower.slot];let target=s.enemies.find(e=>{let q=at(e.progress);return e.hp>0&&!e.dead&&e.card[2]===tower.tone&&Math.hypot((q.x-pos[0]/100)*.8,(q.y-pos[1]/100))<.31});if(!target)continue;tower.cooldown=Math.max(.42,1.02-(tower.level-1)*.2);target.hp-=10+(tower.level-1)*4;target.hit=.16;bullet(tower.slot,target,true,tower.tone);s.combo++;s.score+=10;if(s.combo>0&&s.combo%3===0){s.gold+=5;toast('連續答對 '+s.combo+' 次！獎勵 +5 金幣')}if(target.hp<=0&&!target.dead){target.dead=true;s.gold+=kindReward(target);s.kills++;s.score+=20;if(target.kind==='boss')unlockBossCosmetic(s.wave);if(s.kills%3===0)s.gold+=5;document.getElementById('e'+target.id)?.remove()}sound(true);updateHUD()}
 s.enemies=s.enemies.filter(e=>!e.dead);drawActors();
 if(s.lives<=0){end(false);return}
 if(s.spawned===s.waveSize&&s.enemies.length===0){s.nextWaveDelay=(s.nextWaveDelay||0)+dt;if(s.nextWaveDelay>.7){s.nextWaveDelay=0;let refund=s.towers.reduce((sum,t)=>sum+40+(t.level>1?50:0)+(t.level>2?100:0),0);s.gold+=refund;s.towers=[];selected=null;s.learning.stars++;saveLearning();drawActors();updateHUD();if(s.levelWave<level.waves){s.levelWave++;s.spawned=0;s.waveSize=level.count;s.lastSpawn=s.fireClock;build();showBanner('🌟 本波完成！','獲得星星貼紙 +1・防禦塔已清空，退回 '+refund+' 枚金幣，請重新佈防。',1500);sayThenSpawn(namedPraise('你太棒了，挑戰成功！'))}else if(s.wave>=4){end(true);return}else{s.wave++;s.levelWave=1;s.spawned=0;s.waveSize=levels[s.wave-1].count;s.gold+=100;s.lastSpawn=s.fireClock;build();showBanner('🗺️ 來到新地圖！','本波獲得星星貼紙，防禦塔已清空並退回金幣，另補給 100 枚。',1500);sayThenSpawn(namedPraise('你太棒了，挑戰成功！我們來到新的地圖。'))}}}
}
function drawActors(){if(!state)return;let root=document.querySelector('#actors');if(!root)return;let live=new Set();for(let e of state.enemies){live.add('e'+e.id);let el=document.getElementById('e'+e.id);if(!el){el=document.createElement('div');el.id='e'+e.id;el.className='enemy';root.append(el)}let p=at(e.progress);el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%';el.style.zIndex=String(20+Math.round(e.progress*10));el.style.filter=e.hit?'brightness(1.9)':'';el.innerHTML=`<div class="speech" role="button" tabindex="0" aria-label="點擊重聽${e.card[0]}是幾聲" onclick="replayEnemy(${e.id})" style="${e.kind==='boss'?'border-color:#b8342d;box-shadow:0 3px #84251f,0 0 0 3px #ffd66d':''}"><span class="zhuyin">${e.card[1]}</span><b class="glyph">${e.kind==='boss'?'👑 '+e.card[0]:e.card[0]}</b></div><div class="hp" style="${e.kind==='boss'?'width:78px;height:11px;border:2px solid #9e2727':''}"><i style="width:${Math.max(0,e.hp/e.max*100)}%;${e.kind==='boss'?'background:#e64f43':''}"></i></div><div class="monster" style="${e.kind==='boss'?'font-size:54px;filter:drop-shadow(0 0 9px #ff4938)':''}">${monsterSets[state.wave-1][e.kind]}</div>`}root.querySelectorAll('.enemy').forEach(el=>{if(!live.has(el.id))el.remove()});document.querySelectorAll('.slot').forEach(el=>{let t=state.towers.find(x=>x.slot===+el.dataset.slot);el.classList.toggle('occupied',!!t);el.classList.toggle('active',!t&&!!selected);el.setAttribute('aria-label',t?tones[t.tone-1].name+'，等級 '+t.level:'空塔位 '+(+el.dataset.slot+1));el.innerHTML=t?`<span class="placed-tone" style="--tone-mark:${tones[t.tone-1].markColor}"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${tones[t.tone-1].path}" fill="none" stroke="${tones[t.tone-1].markColor}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg></span><small style="position:absolute;bottom:-15px;font-size:10px;color:#19304c;white-space:nowrap">Lv.${t.level}</small>`:(selected?'＋':'')})}
function bullet(slot,target,correct,tone){let root=document.querySelector('#actors');if(!root)return;let rootRect=root.getBoundingClientRect(),towerEl=document.querySelector('.slot[data-slot="'+slot+'"]'),monsterEl=document.querySelector('#e'+target.id+' .monster');if(!root||!towerEl||!monsterEl)return;let center=node=>{let r=node.getBoundingClientRect();return{x:r.left+r.width/2-rootRect.left,y:r.top+r.height/2-rootRect.top}},from=center(towerEl),to=center(monsterEl),el=document.createElement('i');el.className='bullet';el.textContent=tones[tone-1].icon;el.style.setProperty('--shot-color',tones[tone-1].color);el.style.transition='none';el.style.left=from.x+'px';el.style.top=from.y+'px';root.append(el);let began=performance.now(),flight=360,last=to;function fly(now){let live=document.querySelector('#e'+target.id+' .monster');if(live)last=center(live);let t=Math.min(1,(now-began)/flight);el.style.left=(from.x+(last.x-from.x)*t)+'px';el.style.top=(from.y+(last.y-from.y)*t)+'px';if(t<1){requestAnimationFrame(fly);return}el.remove();let h=document.createElement('b');h.className='hit';h.textContent=correct?'−10':'−1';h.style.left=last.x+'px';h.style.top=last.y+'px';root.append(h);setTimeout(()=>h.remove(),700)}requestAnimationFrame(fly)}
function updateHUD(){if(!state)return;let set=(id,x)=>{let e=document.getElementById(id);if(e)e.textContent=x};set('lives',state.lives);set('gold',state.gold);set('wave',state.wave);set('levelwave',state.levelWave);set('wavecount',levels[Math.max(0,state.wave-1)].waves);set('waveinfo','第 '+state.levelWave+' / '+levels[Math.max(0,state.wave-1)].waves+' 波');saveGold()}
function showBanner(title,sub,ms=0){let b=document.querySelector('#banner');if(!b)return;clearTimeout(bannerTimer);b.innerHTML=`<div>${title}<small>${sub}</small></div>`;if(ms)bannerTimer=setTimeout(()=>{if(b)b.innerHTML=''},ms)}
function pause(){if(!state?.running||state.result)return;state.paused=!state.paused;document.querySelector('#pause').textContent=state.paused?'▶ 繼續':'Ⅱ 暫停';if(state.paused)showBanner('⏸️ 休息一下','怪物暫停移動。');else{document.querySelector('#banner').innerHTML='';schedulePendingEnemy()}}
function end(win){state.result=win?'win':'lose';state.running=false;cancelAnimationFrame(raf);let b=document.querySelector('#banner');b.classList.toggle('failure',!win);if(win){b.innerHTML=`<div>🏆 守住星星城堡！<small>完成四張地圖、30 波怪物，還打敗了四隻大魔王！　⭐ ${state.score} 分</small><p><button class="bigbtn" onclick="start()">再玩一次</button> <button class="bigbtn" onclick="beginScreen()">選擇關卡</button></p></div>`;say(namedPraise('你太棒了！你完成四個關卡，也打敗了四隻大魔王！'));return}b.innerHTML=`<div><div class="failure-icon">💥🛡️</div>再接再厲！<small>城堡愛心用完了。下次多放幾座聲調正確的塔！<br>⭐ ${state.score} 分</small><p class="failure-home">10 秒後回到關卡首頁</p><button class="bigbtn" onclick="beginScreen()">立即回首頁</button></div>`;sound(false);say('這一局結束了，休息一下再回首頁挑戰吧！');resultTimer=setTimeout(()=>{if(state?.result==='lose')beginScreen()},10000)}
function toast(text){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=text;clearTimeout(window._toast);window._toast=setTimeout(()=>el.remove(),1450)}
function chooseStage(n){chosenStage=n;beginScreen()}
function beginScreen(){clearTimeout(resultTimer);clearTimeout(spawnTimer);spawnTimer=0;stopVoice();state=fresh();app.innerHTML=`<div class="modalbg"><section class="modal" style="max-height:calc(100vh - 24px);overflow-y:auto"><div style="font-size:58px">🏰</div><h1>聲調守衛戰</h1><p>選一張地圖開始冒險！<br>聽語音題目、看注音，再準備對應聲調塔。</p><label style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;font-size:14px">孩子姓名<input id="playerName" maxlength="12" value="${safeText(playerName)}" placeholder="輸入姓名" oninput="rememberPlayerName(this.value)" style="width:145px;border:2px solid #b7cbd1;border-radius:11px;padding:7px 9px;font:inherit;background:#fff"></label><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0">${maps.map((m,i)=>`<button onclick="chooseStage(${i+1})" aria-pressed="${chosenStage===i+1}" style="border:3px solid ${chosenStage===i+1?'#f4ad35':'#d5e0d5'};border-radius:15px;padding:8px 4px;background:${chosenStage===i+1?'#fff0bd':'#f2f7e9'};display:grid;justify-items:center;gap:2px;min-height:82px;font-weight:950"><span style="font-size:24px">${monsterSets[i].normal} ${monsterSets[i].boss}</span><b>${'第 '+(i+1)+' 關・'+m.name}</b><small>${levels[i].waves} 波・每波 ${levels[i].count} 隻<br>${levels[i].slots} 個塔位・${levels[i].hint}</small></button>`).join('')}</div><div class="guide">${tones.map(t=>`<span class="tag" style="color:${t.color}">${t.mark} ${t.name}</span>`).join('')}</div><p style="margin:9px 0">只有同聲調的防禦塔才能攻擊怪物<br>每關最後一波會有高血量大魔王。</p><p style="margin:6px 0;color:#356477;font-weight:900">📚 題庫：${cards.length} 個國字</p><p style="margin:6px 0;color:#785a2c">金幣金庫：💰 <b>${state.gold}</b>（會累積保留）</p><p style="margin:6px 0;color:#755e27">🌟 星星貼紙：${state.learning.stars}　🎁 裝飾收藏：${state.learning.cosmetics.map(i=>bossCosmetics[i-1]?.icon||'').join(' ')||'打敗魔王解鎖'}</p><p style="margin:6px 0;color:#466b83">目前節奏：${difficultyProfile().label}（依聽辨表現調整怪物速度與聲調混合程度）</p><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:7px 0"><button class="bigbtn" onclick="launch()">開始第 ${chosenStage} 關</button><button class="bigbtn shop-entry" onclick="openShop()">⭐ 星星商店</button></div><p style="font-size:12px;color:#69727b">電腦可拖曳聲調塔；手機可點塔，再點地圖空位。</p></section></div>`}
function launch(){unlockAudio();state.gold=Math.max(1000,state.gold);state.wave=chosenStage;state.levelWave=1;state.waveSize=levels[chosenStage-1].count;build();state.running=true;window.speechSynthesis?.resume();spawn();updateHUD();last=performance.now();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state?.running)pause()});beginScreen();
</script></body></html>
