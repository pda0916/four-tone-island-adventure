<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4fbfa"><meta name="description" content="JOJO 數感任務：接著填、比一比、分一分、看圖算、減一減、找數字，六題一起玩。"><title>JOJO 數學｜六題數感任務</title><style>
:root{--ink:#202744;--blue:#58baf0;--green:#63e4a0;--purple:#caa2f0;--paper:#f4fbfa;--line:#d6e0e1}*{box-sizing:border-box}body{margin:0;background:#eaf0ef;color:var(--ink);font-family:"Arial Rounded MT Bold","Microsoft JhengHei",system-ui,sans-serif;font-weight:650}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}header{height:64px;position:sticky;top:0;z-index:2;background:#f8fdfc;border-bottom:1px solid #dae5e4;display:flex;align-items:center;justify-content:space-between;padding:8px max(calc((100vw - 900px)/2),12px);gap:12px}.hleft,.hright{display:flex;align-items:center;gap:12px}.round{border:0;background:#e7f7ff;color:#42a6df;border-radius:50%;width:40px;height:40px;font-size:23px}.meter{font-size:14px;color:#429cd0;white-space:nowrap}.meter i{display:inline-block;width:min(22vw,150px);height:9px;border-radius:8px;margin:0 7px;background:repeating-linear-gradient(90deg,#58baf0 0 5px,#e0f1f4 5px 8px);vertical-align:middle}.avatar{font-size:32px;background:#fff4ba;border-radius:50%;width:48px;height:48px;text-align:center}.main{max-width:840px;margin:auto;padding:13px 16px 105px}.intro{padding:0 4px 12px;font-size:14px;line-height:1.45}.intro p{margin:0}.sheet{background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:12px;box-shadow:0 5px 16px #45616a0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{min-width:0;min-height:198px;border:2px solid var(--c);border-radius:16px;background:var(--wash);padding:10px 10px 9px;position:relative;display:flex;flex-direction:column;overflow:hidden}.card:nth-child(1),.card:nth-child(2){min-height:166px}.title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900}.num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#14608c;display:inline-grid;place-items:center;flex:none;font-size:17px}.problem{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:25px;padding:7px 0;white-space:nowrap}.answer{width:49px;height:43px;border:2px solid #52b8f3;border-radius:7px;background:white;text-align:center;font-size:24px;font-weight:800;outline:none;padding:1px}.answer:focus{box-shadow:0 0 0 3px #74cfff55}.answer.ok{border-color:#24bd78;background:#e8fff2}.answer.bad{border-color:#f08f69;background:#fff2eb}.roweq{display:flex;align-items:center;justify-content:center;gap:7px;font-size:23px;margin:4px 0}.pairs{display:flex;flex-direction:column;gap:3px;width:100%;white-space:normal;font-size:17px}.pairrow{display:flex;justify-content:center;align-items:center;gap:8px}.part{display:flex;align-items:center;justify-content:center;width:39px;height:38px;border:2px solid #55baf0;border-radius:50%;background:#ffffffb5;font-size:20px}.part.blank{border-radius:7px;width:48px;height:39px}.tree{position:relative;width:136px;height:116px;margin:auto}.tree:before,.tree:after{content:"";position:absolute;height:2px;width:55px;background:#3186bc;left:29px;top:59px;transform:rotate(55deg);transform-origin:right}.tree:after{left:66px;transform:rotate(-55deg);transform-origin:left}.node{position:absolute;z-index:1;width:56px;height:56px;border:2px solid #42b7c6;background:#eefff8;border-radius:50%;display:grid;place-items:center;font-size:23px}.node.top{left:40px;top:0}.node.left{left:0;bottom:0;border-color:#62b9f2}.node.right{right:0;bottom:0;border-color:#62b9f2}.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:min(100%,260px);margin:4px auto}.dot{height:24px;border:1.5px solid #48aeea;border-radius:4px;background:white;display:grid;place-items:center}.dot b{width:17px;height:17px;border-radius:50%;background:#4db4ed}.dot.red b{background:#fa8177}.dotsub{height:auto;min-height:29px;max-width:250px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:auto}.dotsub i{width:19px;height:19px;border-radius:50%;background:#4db4ed}.dotsub i:nth-last-child(-n+6){background:#fa8177}.check{align-self:flex-end;min-height:27px;border:0;border-radius:9px;padding:4px 11px;background:#ffffffc9;color:#377fa3;font-size:14px;font-weight:900}.check:hover{background:#fff}.msg{min-height:18px;text-align:center;font-size:12px;color:#48805e}.card.done{animation:pop .25s}.bottom{display:flex;justify-content:center;gap:13px;margin:14px 0 0}.primary{border:0;border-radius:14px;padding:11px 22px;background:#53bdf1;color:#fff;font-size:16px;font-weight:900;box-shadow:0 4px 0 #3395ca}.secondary{border:0;border-radius:14px;padding:10px 16px;background:#e3f4ee;color:#397a64;font-weight:850}.nav{max-width:850px;position:fixed;z-index:3;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);height:70px;border:1px solid #fff;border-radius:38px;background:#ffffffed;box-shadow:0 4px 24px #3c565622;display:flex;align-items:center;justify-content:space-around}.nav button{border:0;background:transparent;font-size:24px;padding:9px 16px;color:#242b3d}.nav button.active{background:#e5e8e8;border-radius:34px}.toast{position:fixed;z-index:5;top:76px;left:50%;transform:translateX(-50%);background:#273e38;color:#fff;padding:10px 17px;border-radius:16px;box-shadow:0 4px 16px #0002;animation:pop .25s;white-space:nowrap}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:21px;animation:fly .75s ease-out forwards}@keyframes fly{to{transform:translateY(-60px) rotate(25deg);opacity:0}}@keyframes pop{50%{transform:scale(1.035)}}.dialogbg{position:fixed;z-index:6;inset:0;background:#1c2d3d66;display:grid;place-items:center;padding:20px}.dialog{max-width:390px;width:100%;border-radius:22px;background:#f7fcfa;padding:23px;text-align:center}.dialog h2{margin:4px}.dialog button{margin:6px}@media(max-width:520px){header{height:58px;padding:6px 10px;gap:5px}.meter{font-size:12px}.meter i{width:70px;height:8px;margin:0 3px}.avatar{width:38px;height:38px;font-size:25px}.round{width:34px;height:34px}.main{padding:9px 9px 96px}.intro{padding:0 4px 9px;font-size:13px}.sheet{padding:8px;border-radius:21px}.grid{gap:7px}.card{padding:7px 6px;min-height:177px}.card:nth-child(1),.card:nth-child(2){min-height:145px}.title{font-size:15px;gap:5px}.num{width:24px;height:24px;font-size:15px}.problem{font-size:17px;gap:2px}.problem .answer{width:33px;height:36px;padding:0}.answer{width:40px;height:38px;font-size:21px}.roweq{font-size:17px;gap:3px}.roweq .answer{width:34px;height:36px;padding:0}.pairrow{gap:5px}.pairs{font-size:15px}.part{width:33px;height:32px;font-size:17px}.part.blank{width:39px;height:34px}.tree{transform:scale(.88);transform-origin:center}.dot{height:20px}.dot b{width:14px;height:14px}.dotsub i{width:15px;height:15px}.check{font-size:12px;padding:4px 7px}.nav{height:62px;width:calc(100% - 22px)}.nav button{font-size:21px;padding:8px 12px}.bottom{gap:7px}.primary{padding:10px 16px}}
</style></head><body><header><div class="hleft"><button class="round" id="back" aria-label="上一頁">‹</button><span class="meter">◷ <b id="time">09:45</b> <i></i><b id="progress">0/6</b></span></div><div class="avatar">🐥</div><div class="hright"><button class="round" id="sound" aria-label="音效">🔊</button><button class="round" id="help" aria-label="幫助">▣</button><button class="round" id="prev" aria-label="上一題">‹</button><button class="round" id="next" aria-label="下一題">›</button></div></header><main class="main"><section class="intro"><p><b>🌟 JOJO 數學小任務</b>　先看短題幹，再一步步完成！</p><p>從填數、比大小、分一分，到看圖計算和找答案。</p></section><section class="sheet"><div class="grid" id="grid"></div><div class="bottom"><button class="secondary" id="new">↻ 換一份練習</button><button class="primary" id="finish">完成這一輪　✓</button></div></section></main><div class="nav"><button class="active" aria-label="首頁">⌂</button><button id="inbox" aria-label="任務">▱</button><button id="new2" aria-label="新練習">＋</button><button id="heart" aria-label="星星">♡</button><button id="parent" aria-label="家長專區">♙</button></div><div id="live" aria-live="polite"></div><script>
const $=s=>document.querySelector(s),tones=['#51b9ef','#66e4a0','#c79aee','#ffcb72'],washes=['#eaf7ff','#edfff4','#f6efff','#fff8e8'],labels=['接著填','比一比','分一分','看圖算','減一減','找數字'];let sheet=[],audioOn=true,ctx=null,started=performance.now(),checked=new Set(),stars=+(localStorage.getItem('jojo-stars')||0),sec=585;
const rand=n=>Math.floor(Math.random()*n),val=(c)=>`<input type="text" inputmode="numeric" maxlength="2" class="answer" data-answer="${String(c).replaceAll('<','&lt;').replaceAll('>','&gt;')}" aria-label="填入答案">`;
function make(){let a=1+rand(3),n=10+rand(5),x=5+rand(5),y=1+rand(9-x),sub=11+rand(5),take=3+rand(5);return [
{body:`<div class="problem">1　3　5　${val(7)}　9　${val(11)}</div>`,ans:[7,11]},
{body:`<div class="pairs"><div class="pairrow">8　${val("<")}　11</div><div class="pairrow">14　${val("=")}　14</div><div class="pairrow">16　${val(">") }　13</div></div>`,ans:['<','=', '>']},
{body:`<div class="tree"><div class="node top">${n}</div><div class="node left">${x}</div><div class="node right blank">${val(n-x)}</div></div>`,ans:[n-x]},
{body:`<div class="roweq">${x} + ${y} = ${val(x+y)}</div><div class="tenframe">${Array.from({length:10},(_,i)=>`<span class="dot ${i>=x&&i<x+y?'red':''}"><b></b></span>`).join('')}</div>`,ans:[x+y]},
{body:`<div class="roweq">${sub} − ${take} = ${val(sub-take)}</div><div class="dotsub">${Array.from({length:sub},(_,i)=>`<i style="${i>=sub-take?'opacity:.32':''}"></i>`).join('')}</div><small>點點數一數，還剩幾個？</small>`,ans:[sub-take]},
{body:`<div class="roweq">${val(13-7)} + 7 = 13</div><div class="roweq">16 − ${val(7)} = 9</div>`,ans:[6,7]}
]}
function render(){let d=make();sheet=d;checked.clear();$('#grid').innerHTML=d.map((q,i)=>`<article class="card" style="--c:${tones[i%4]};--wash:${washes[i%4]}" id="q${i}"><div class="title"><span class="num">${i+1}</span>${labels[i]}</div>${q.body}<button class="check" data-check="${i}">檢查　✓</button><div class="msg" id="m${i}"></div><div class="stars" id="s${i}"></div></article>`).join('');document.querySelectorAll('.check').forEach(b=>b.onclick=()=>check(+b.dataset.check));document.querySelectorAll('.answer').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter'){let card=x.closest('.card');check(+card.id.slice(1))}});update()}
function update(){let n=0;document.querySelectorAll('.answer').forEach(x=>{if(x.value.trim())n++});$('#progress').textContent=checked.size+'/6';$('#count')?.remove();$('#time').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function ding(ok){if(!audioOn)return;try{ctx??=new AudioContext();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?660:260;g.gain.value=.07;o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.14)}catch{}}
function say(s){if(!audioOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let v=speechSynthesis.getVoices().find(x=>/^zh[-_]TW/i.test(x.lang));if(v){let u=new SpeechSynthesisUtterance(s);u.voice=v;u.rate=.85;speechSynthesis.speak(u)}}
function toast(s){$('#live').innerHTML=`<div class="toast">${s}</div>`;setTimeout(()=>$('#live').innerHTML='',1700)}
function check(i){let c=$('#q'+i),inputs=[...c.querySelectorAll('.answer')],answers=sheet[i].ans;if(inputs.some(x=>!x.value.trim())){toast('再想一想，空格都填好再檢查唷！');say('請把每個空格填好，再檢查。');return}let ok=inputs.every((x,j)=>x.value.trim()===String(answers[j]));if(!ok){inputs.forEach((x,j)=>x.classList.toggle('bad',x.value.trim()!==String(answers[j])));$('#m'+i).textContent='再想一想，看看數字的規律喔！';ding(false);say('再想一想，看看數字的規律喔。');return}inputs.forEach(x=>{x.classList.remove('bad');x.classList.add('ok')});$('#m'+i).textContent='太棒了！這題完成 ✨';c.classList.add('done');if(!checked.has(i)){checked.add(i);stars++;localStorage.setItem('jojo-stars',stars);for(let k=0;k<3;k++){let e=document.createElement('span');e.className='star';e.textContent='⭐';e.style.left=(30+rand(50))+'%';e.style.top='50%';c.querySelector('.stars').append(e);setTimeout(()=>e.remove(),800)}}ding(true);say('答對了，太棒了！');update()}
function move(d){let active=document.activeElement;if(active?.classList.contains('answer')){let arr=[...document.querySelectorAll('.answer')],i=arr.indexOf(active);arr[Math.max(0,Math.min(arr.length-1,i+d))].focus();return}let first=$('#q0');first.scrollIntoView({behavior:'smooth',block:'center'})}
$('#sound').onclick=()=>{audioOn=!audioOn;$('#sound').textContent=audioOn?'🔊':'🔇';if(!audioOn)speechSynthesis?.cancel()};$('#help').onclick=()=>{say('每題都有一個或兩個空格，填好後按檢查。完成六題後按完成這一輪。');toast('填好空格，再按每題右下的檢查。')};$('#back').onclick=$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#new').onclick=$('#new2').onclick=()=>{if(confirm('要換一份新的六題練習嗎？'))render()};$('#finish').onclick=()=>{if(checked.size<6){toast(`你已完成 ${checked.size} 題，再完成 ${6-checked.size} 題吧！`);return}toast('六題全部完成！你是數學小高手 🏆');say('六題全部完成，你是數學小高手！')};$('#heart').onclick=()=>toast('你已收集 '+stars+' 顆星星！');$('#parent').onclick=()=>{let code=prompt('家長專區：請輸入 1234 查看本機紀錄');if(code==='1234')alert(`累積星星：${stars}\n本輪完成：${checked.size}/6`) };$('#inbox').onclick=()=>$('#q0').scrollIntoView({behavior:'smooth'});setInterval(()=>{sec=Math.max(0,sec-1);update()},1000);render();
</script></body></html>
